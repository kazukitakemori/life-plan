name: Temporary Q12 safety follow-up

on:
  push:
    branches:
      - feat/second-life-housing-living-q12
    paths:
      - scripts/tmp_q12_safety_followup.py
      - .github/workflows/tmp-q12-safety-followup.yml

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/second-life-housing-living-q12
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply safety patch
        run: python scripts/tmp_q12_safety_followup.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Remove temporary files
        run: |
          rm scripts/tmp_q12_safety_followup.py
          rm .github/workflows/tmp-q12-safety-followup.yml
      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden Q12 fallback and wording"
          git push origin HEAD:feat/second-life-housing-living-q12
