name: One-off UI layout risk audit

on:
  push:
    branches:
      - ui/unify-foundation-cleanup
    paths:
      - '.github/workflows/ui-layout-risk-audit-once.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Audit nowrap, tight controls and overflow risks
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          from collections import Counter, defaultdict

          atomic = re.compile(r'(unit|badge|date|year|month|age|amount|icon|help|status|tab|yen|suffix|prefix|q\b|index|handle|chevron|remove|delete|close|menu-btn|toggle)', re.I)
          control = re.compile(r'(button|btn|input|select|textarea|control|toggle|action|open|apply|add|remove|delete|save|copy|fetch|next|back)', re.I)
          findings = defaultdict(list)

          for path in sorted(Path('src').rglob('*.css')):
              lines = path.read_text(encoding='utf-8').splitlines()
              selector = ''
              buf = []
              for i, line in enumerate(lines, 1):
                  s = line.strip()
                  if '{' in line:
                      before = line.split('{', 1)[0].strip()
                      if before: buf.append(before)
                      selector = ' '.join(buf)[-380:]
                      buf=[]
                  elif s and ':' not in s and '}' not in s and not s.startswith('@') and not s.startswith('/*') and not s.startswith('*'):
                      buf.append(s)

                  if re.search(r'white-space\s*:\s*nowrap\b', line) and not atomic.search(selector):
                      findings['NOWRAP_NONATOMIC'].append((str(path),i,selector,s))

                  m = re.search(r'(?<!min-)(?<!max-)height\s*:\s*([0-9.]+)px', line)
                  if m and float(m.group(1)) < 40 and control.search(selector) and not atomic.search(selector):
                      findings['TIGHT_TEXT_CONTROL_HEIGHT'].append((str(path),i,selector,s))

                  m = re.search(r'(?<!min-)(?<!max-)width\s*:\s*([0-9.]+)px', line)
                  if m and float(m.group(1)) <= 90 and control.search(selector) and not atomic.search(selector):
                      findings['NARROW_TEXT_CONTROL_WIDTH'].append((str(path),i,selector,s))

                  m = re.search(r'max-width\s*:\s*([0-9.]+)px', line)
                  if m and float(m.group(1)) <= 140 and re.search(r'(label|title|name|desc|note|text|summary|brand|current)', selector, re.I):
                      findings['TIGHT_TEXT_MAX_WIDTH'].append((str(path),i,selector,s))

                  if re.search(r'overflow-x\s*:\s*hidden\b', line):
                      findings['HIDDEN_X'].append((str(path),i,selector,s))

                  if re.search(r'overflow\s*:\s*hidden\b', line) and re.search(r'(label|title|name|desc|note|text|summary|button|btn)', selector, re.I):
                      findings['TEXT_OVERFLOW_HIDDEN'].append((str(path),i,selector,s))

                  if '}' in line: selector=''

          for path in sorted(Path('src').rglob('*.tsx')):
              for i,line in enumerate(path.read_text(encoding='utf-8').splitlines(),1):
                  if re.search(r'whiteSpace\s*:\s*["\']nowrap["\']',line):
                      findings['TSX_NOWRAP'].append((str(path),i,'',line.strip()))
                  if re.search(r'overflowX\s*:\s*["\']hidden["\']',line):
                      findings['TSX_HIDDEN_X'].append((str(path),i,'',line.strip()))

          print('=== UI LAYOUT RISK AUDIT ===')
          for kind in ['NOWRAP_NONATOMIC','TIGHT_TEXT_CONTROL_HEIGHT','NARROW_TEXT_CONTROL_WIDTH','TIGHT_TEXT_MAX_WIDTH','TEXT_OVERFLOW_HIDDEN','HIDDEN_X','TSX_NOWRAP','TSX_HIDDEN_X']:
              items=findings[kind]
              print(f'\n[{kind}] {len(items)}')
              for p,i,sel,s in items[:120]:
                  print(f'{p}:{i}: {sel} :: {s}')
              if len(items)>120: print(f'... {len(items)-120} more')
          PY
