name: Preview on Cloudflare Workers

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: cloudflare-preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Verify content model persistence and privacy
        run: npx --yes tsx@4.20.5 --tsconfig tsconfig.app.json scripts/verify-content-model.mjs

      - name: Run Q8 pension regression audit
        run: |
          npx --yes tsx@4.20.5 scripts/verify-pension-old-age.mjs
          npx --yes tsx@4.20.5 scripts/verify-pension-payment.mjs
          npx --yes tsx@4.20.5 scripts/verify-pension-cashflow-models.mjs
          npx --yes tsx@4.20.5 scripts/verify-survivor-employees.mjs
          npx --yes tsx@4.20.5 scripts/verify-required-coverage.mjs

      - name: Build preview
        run: npm run build
        env:
          VITE_LICENSE_PREVIEW_UNLOCK: '1'
          VITE_PREVIEW_SEED_DATA: '1'

      - name: Upload preview version to Cloudflare Workers
        id: preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --config wrangler.preview.toml --preview-alias pr-${{ github.event.pull_request.number }}

      - name: Capture SIM-001 smoke images
        run: |
          node scripts/capture-content-image.mjs \
            --base-url "https://pr-${{ github.event.pull_request.number }}-life-plan.kazuki-takemori-sub.workers.dev/" \
            --model-case-id SIM-001-BASE \
            --capture-spec-id SIM-001-CF \
            --source-environment pr-preview \
            --output-dir artifacts/content-captures
          node scripts/capture-content-image.mjs \
            --base-url "https://pr-${{ github.event.pull_request.number }}-life-plan.kazuki-takemori-sub.workers.dev/" \
            --model-case-id SIM-001-BASE \
            --capture-spec-id SIM-001-ASSET \
            --source-environment pr-preview \
            --output-dir artifacts/content-captures
          node scripts/capture-content-image.mjs \
            --base-url "https://pr-${{ github.event.pull_request.number }}-life-plan.kazuki-takemori-sub.workers.dev/" \
            --model-case-id SIM-001-BASE \
            --capture-spec-id SIM-001-LIFETIME \
            --source-environment pr-preview \
            --output-dir artifacts/content-captures
          node scripts/capture-content-image.mjs \
            --base-url "https://pr-${{ github.event.pull_request.number }}-life-plan.kazuki-takemori-sub.workers.dev/" \
            --model-case-id SIM-001-BASE \
            --capture-spec-id SIM-001-COVERAGE \
            --source-environment pr-preview \
            --output-dir artifacts/content-captures

      - name: Upload content capture artifact
        uses: actions/upload-artifact@v4
        with:
          name: content-capture-pr-${{ github.event.pull_request.number }}
          path: artifacts/content-captures
          if-no-files-found: error

      - name: Add capture manifest to job summary
        shell: bash
        run: |
          echo "## Content capture smoke" >> "$GITHUB_STEP_SUMMARY"
          echo '~~~json' >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/content-captures/*.manifest.json >> "$GITHUB_STEP_SUMMARY"
          echo '~~~' >> "$GITHUB_STEP_SUMMARY"

      - name: Add preview output to job summary
        shell: bash
        env:
          CMD_OUTPUT: ${{ steps.preview.outputs.command-output }}
        run: |
          echo "## PR Preview" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "$CMD_OUTPUT" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
