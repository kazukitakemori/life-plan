name: Apply temporary Q12 housing and living patch

on:
  push:
    branches:
      - feat/second-life-housing-living-q12

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/second-life-housing-living-q12
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Apply source changes
        run: |
          python scripts/tmp_second_life_q12_patch.py
          python scripts/tmp_second_life_q12_fix.py

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit patch
        shell: bash
        run: |
          rm scripts/tmp_second_life_q12_patch.py
          rm scripts/tmp_second_life_q12_fix.py
          rm .github/workflows/tmp-second-life-q12-housing-living.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Consolidate second-life housing and living in Q12"
          git push origin HEAD:feat/second-life-housing-living-q12
