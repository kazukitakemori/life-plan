name: One-off legacy CSS cleanup

on:
  push:
    branches:
      - refactor/mobile-responsive-steps
    paths:
      - .github/workflows/cleanup-legacy-css-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/mobile-responsive-steps
          fetch-depth: 0

      - name: Remove final unused legacy CSS blocks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path('src')
          css_path = root / 'index.css'
          source = css_path.read_text(encoding='utf-8')

          legacy_token = re.compile(
              r'(?<![A-Za-z0-9_-])(?:show-all-btn|footer-action-btn|member-tabs(?:-[A-Za-z0-9_-]+)*|member-tab(?:-[A-Za-z0-9_-]+)*)(?![A-Za-z0-9_-])'
          )
          # The class may be qualified by an element, e.g. button.member-tab.
          legacy_selector = re.compile(
              r'\.(?:show-all-btn|footer-action-btn|member-tabs(?:-[A-Za-z0-9_-]+)*|member-tab(?:-[A-Za-z0-9_-]+)*)(?![A-Za-z0-9_-])'
          )

          references = []
          for path in root.rglob('*'):
              if path.suffix not in {'.ts', '.tsx', '.js', '.jsx'}:
                  continue
              text = path.read_text(encoding='utf-8')
              for match in legacy_token.finditer(text):
                  line = text.count('\n', 0, match.start()) + 1
                  references.append(f'{path}:{line}: {match.group(0)}')

          if references:
              print('Legacy class references remain in application code:', file=sys.stderr)
              print('\n'.join(references[:100]), file=sys.stderr)
              sys.exit(1)

          def strip_comments(text: str) -> str:
              return re.sub(r'/\*.*?\*/', '', text, flags=re.S)

          def find_open(text: str, start: int) -> int:
              i = start
              quote = None
              while i < len(text):
                  if text.startswith('/*', i):
                      end = text.find('*/', i + 2)
                      if end < 0:
                          return -1
                      i = end + 2
                      continue
                  ch = text[i]
                  if quote:
                      if ch == '\\':
                          i += 2
                          continue
                      if ch == quote:
                          quote = None
                      i += 1
                      continue
                  if ch in {'"', "'"}:
                      quote = ch
                      i += 1
                      continue
                  if ch == '{':
                      return i
                  i += 1
              return -1

          def find_close(text: str, open_index: int) -> int:
              depth = 1
              i = open_index + 1
              quote = None
              while i < len(text):
                  if text.startswith('/*', i):
                      end = text.find('*/', i + 2)
                      if end < 0:
                          raise ValueError('Unclosed CSS comment')
                      i = end + 2
                      continue
                  ch = text[i]
                  if quote:
                      if ch == '\\':
                          i += 2
                          continue
                      if ch == quote:
                          quote = None
                      i += 1
                      continue
                  if ch in {'"', "'"}:
                      quote = ch
                      i += 1
                      continue
                  if ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          return i
                  i += 1
              raise ValueError('Unclosed CSS block')

          removed = []

          def process_rule_list(text: str) -> str:
              out = []
              pos = 0
              while pos < len(text):
                  open_index = find_open(text, pos)
                  if open_index < 0:
                      out.append(text[pos:])
                      break
                  header = text[pos:open_index]
                  close_index = find_close(text, open_index)
                  body = text[open_index + 1:close_index]
                  clean_header = strip_comments(header).strip()

                  if clean_header.startswith('@'):
                      out.append(header + '{' + process_rule_list(body) + '}')
                  elif legacy_selector.search(clean_header):
                      removed.append(clean_header)
                      leading_match = re.match(r'(?s)^(\s*(?:/\*.*?\*/\s*)*)', header)
                      out.append(leading_match.group(1) if leading_match else '')
                  else:
                      out.append(header + '{' + body + '}')
                  pos = close_index + 1
              return ''.join(out)

          cleaned = process_rule_list(source)
          if not removed:
              print('No legacy CSS rules matched; refusing to create an empty cleanup commit.', file=sys.stderr)
              sys.exit(1)

          remaining = legacy_selector.findall(strip_comments(cleaned))
          if remaining:
              print(f'Legacy selectors still remain after cleanup: {sorted(set(remaining))}', file=sys.stderr)
              sys.exit(1)

          css_path.write_text(cleaned, encoding='utf-8')
          print(f'Removed {len(removed)} final legacy CSS rule blocks.')
          for selector in removed:
              print(f'  - {selector}')
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.css
          git commit -m "旧人物タブCSSの残骸を削除"
          git push origin HEAD:refactor/mobile-responsive-steps
