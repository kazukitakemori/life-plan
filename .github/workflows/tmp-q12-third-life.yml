name: Temporary old-age and third-life patch

on:
  push:
    branches:
      - feat/second-life-housing-living-q12
    paths:
      - scripts/tmp_q12_third_life.py
      - .github/workflows/tmp-q12-third-life.yml

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/second-life-housing-living-q12
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Apply old-age / third-life patch
        run: python scripts/tmp_q12_third_life.py
      - name: Check legacy care fields
        run: |
          echo '--- annualCostMan references ---'
          grep -R "annualCostMan" -n src || true
          echo '--- facility legacy references ---'
          grep -R "'facility'\|\"facility\"" -n src || true
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Remove temporary files
        run: rm -f scripts/tmp_q12_third_life.py .github/workflows/tmp-q12-third-life.yml
      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Separate old-age planning and deepen third-life care"
          git push origin HEAD:feat/second-life-housing-living-q12
