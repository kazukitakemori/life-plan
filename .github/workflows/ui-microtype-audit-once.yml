name: One-off UI microtype audit

on:
  push:
    branches:
      - ui/unify-foundation-cleanup
    paths:
      - '.github/workflows/ui-microtype-audit-once.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Find all explicit font sizes below 13px
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          from collections import Counter

          findings=[]
          for path in sorted(Path('src').rglob('*.css')):
              lines=path.read_text(encoding='utf-8').splitlines()
              selector=''
              buf=[]
              for i,line in enumerate(lines,1):
                  s=line.strip()
                  if '{' in line:
                      before=line.split('{',1)[0].strip()
                      if before: buf.append(before)
                      selector=' '.join(buf)[-320:]
                      buf=[]
                  elif s and ':' not in s and '}' not in s and not s.startswith('@') and not s.startswith('/*') and not s.startswith('*'):
                      buf.append(s)
                  m=re.search(r'font-size\s*:\s*([0-9.]+)(px|rem|em)\b', line)
                  if m:
                      value=float(m.group(1)); unit=m.group(2)
                      px=value if unit=='px' else value*16
                      if px < 13:
                          findings.append((str(path),i,selector,px,s))
                  if '}' in line: selector=''

          print(f'EXPLICIT_FONT_SIZE_LT13_TOTAL={len(findings)}')
          by=Counter(p for p,_,_,_,_ in findings)
          for p,n in by.most_common(): print(f'FILE {n:3d} {p}')
          print('\nDETAILS')
          for p,i,sel,px,s in findings:
              print(f'{p}:{i}: {px:.2f}px :: {sel} :: {s}')
          PY
