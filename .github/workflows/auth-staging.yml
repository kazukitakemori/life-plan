name: Auth staging on Cloudflare Workers

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - ".github/workflows/auth-staging.yml"
      - "worker/**"
      - "src/**"
      - "migrations/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: auth-staging-life-plan
  cancel-in-progress: true

jobs:
  deploy-auth-staging:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feature/google-cloud-sync'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_WORKER_NAME: life-plan-auth-staging
      STAGING_DB_NAME: life-plan-auth-staging
      STAGING_ORIGIN: https://life-plan-auth-staging.kazuki-takemori-sub.workers.dev
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      SES_FROM_EMAIL: ${{ secrets.SES_FROM_EMAIL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Diagnose Cloudflare staging access
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN || '';
          const account = process.env.CLOUDFLARE_ACCOUNT_ID || '';
          const expectedAccount = 'ea6981d043d74c098e5fe4cd096a0172';
          console.log(JSON.stringify({
            tokenPresent: Boolean(token),
            tokenHasOuterWhitespace: token !== token.trim(),
            accountMatchesExpected: account === expectedAccount,
          }));
          if (!token || account !== expectedAccount || token !== token.trim()) {
            throw new Error('Cloudflare secret is missing, malformed, or targets another account.');
          }
          async function check(label, path) {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              headers: { Authorization: `Bearer ${token}` },
            });
            const data = await response.json();
            console.log(JSON.stringify({
              check: label, httpStatus: response.status, success: data.success,
              errorCodes: data.errors?.map(error => error.code),
              ...(label.includes('verify') && data.success ? {
                tokenId: data.result.id, tokenStatus: data.result.status,
                expiresOn: data.result.expires_on || null,
                notBefore: data.result.not_before || null,
              } : {}),
            }));
            return data;
          }
          const verification = await check('user-token-verify', '/user/tokens/verify');
          if (!verification.success) {
            await check('account-token-verify', `/accounts/${account}/tokens/verify`);
          }
          await check('workers-read', `/accounts/${account}/workers/scripts`);
          const d1 = await check('d1-read', `/accounts/${account}/d1/database`);
          if (!d1.success) throw new Error('The Actions token cannot access D1 in the expected account.');
          NODE

      - name: Build production-like staging
        run: npm run build
        env:
          VITE_LICENSE_PREVIEW_UNLOCK: "0"
          VITE_PREVIEW_SEED_DATA: "0"

      - name: Resolve dedicated staging D1
        id: resolve_d1
        shell: bash
        run: |
          set -euo pipefail

          get_db_id() {
            local json
            if ! json="$(npx wrangler d1 list --json)"; then
              echo "Cloudflare D1 API access failed. The CI token needs Account > D1 > Edit permission." >&2
              return 1
            fi
            printf '%s' "$json" | node --input-type=module -e "
              let input='';
              process.stdin.on('data', d => input += d);
              process.stdin.on('end', () => {
                const rows = JSON.parse(input);
                const found = rows.find(row => row.name === process.env.STAGING_DB_NAME);
                if (found) process.stdout.write(found.uuid || found.id || '');
              });
            "
          }

          DB_ID="$(get_db_id)"
          if [ -z "$DB_ID" ]; then
            npx wrangler d1 create "$STAGING_DB_NAME"
            DB_ID="$(get_db_id)"
          fi

          if [ -z "$DB_ID" ]; then
            echo "Could not resolve staging D1 database id." >&2
            exit 1
          fi

          cat > wrangler.auth-staging.generated.toml <<EOF
          name = "$STAGING_WORKER_NAME"
          main = "worker/index.js"
          compatibility_date = "2025-01-01"
          workers_dev = true
          preview_urls = true

          [[d1_databases]]
          binding = "DB"
          database_name = "$STAGING_DB_NAME"
          database_id = "$DB_ID"
          migrations_dir = "./migrations"

          [vars]
          AUTH_ORIGIN = "$STAGING_ORIGIN"
          AWS_SES_REGION = "ap-northeast-1"

          [assets]
          directory = "./dist"
          binding = "ASSETS"
          not_found_handling = "single-page-application"
          run_worker_first = ["/api/*"]
          EOF

          echo "STAGING_DB_ID=$DB_ID" >> "$GITHUB_ENV"

      - name: Apply staging D1 migrations
        id: migrate_d1
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.auth-staging.generated.toml

      - name: Deploy auth staging worker
        id: deploy_worker
        run: npx wrangler deploy --config wrangler.auth-staging.generated.toml

      - name: Set staging-only peppers
        id: set_peppers
        shell: bash
        run: |
          set -euo pipefail
          EXISTING_SECRETS="$(npx wrangler secret list --format json --config wrangler.auth-staging.generated.toml)"
          for NAME in EMAIL_AUTH_PEPPER LICENSE_PEPPER; do
            if printf '%s' "$EXISTING_SECRETS" | node --input-type=module -e '
              let input = "";
              process.stdin.on("data", chunk => input += chunk);
              process.stdin.on("end", () => {
                process.exit(JSON.parse(input).some(secret => secret.name === process.argv[1]) ? 0 : 1);
              });
            ' "$NAME"; then
              echo "Preserved $NAME"
            else
              VALUE="$(openssl rand -hex 32)"
              echo "::add-mask::$VALUE"
              printf '%s' "$VALUE" | npx wrangler secret put "$NAME" --config wrangler.auth-staging.generated.toml
              unset VALUE
            fi
          done

      - name: Apply optional Google and SES secrets
        id: set_external_secrets
        shell: bash
        run: |
          set -euo pipefail

          put_if_present() {
            local name="$1"
            local value="$2"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name" --config wrangler.auth-staging.generated.toml
              echo "Configured $name"
            else
              echo "Skipped $name (GitHub secret not configured)"
            fi
          }

          put_if_present GOOGLE_CLIENT_ID "$GOOGLE_CLIENT_ID"
          put_if_present GOOGLE_CLIENT_SECRET "$GOOGLE_CLIENT_SECRET"
          put_if_present AWS_ACCESS_KEY_ID "$AWS_ACCESS_KEY_ID"
          put_if_present AWS_SECRET_ACCESS_KEY "$AWS_SECRET_ACCESS_KEY"
          put_if_present AWS_SESSION_TOKEN "$AWS_SESSION_TOKEN"
          put_if_present SES_FROM_EMAIL "$SES_FROM_EMAIL"

      - name: Staging summary
        run: |
          {
            echo "## Auth staging"
            echo
            echo "- URL: $STAGING_ORIGIN"
            echo "- D1: $STAGING_DB_NAME ($STAGING_DB_ID)"
            echo "- Production Worker/D1 are not modified."
            echo "- Google/SES secrets are applied only when matching GitHub Actions secrets exist."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report auth staging result to PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          STEPS="Resolve D1: ${{ steps.resolve_d1.outcome }}\nMigrate D1: ${{ steps.migrate_d1.outcome }}\nDeploy Worker: ${{ steps.deploy_worker.outcome }}\nSet peppers: ${{ steps.set_peppers.outcome }}\nSet Google/SES secrets: ${{ steps.set_external_secrets.outcome }}"
          if [ "${{ job.status }}" = "success" ]; then
            BODY="✅ Auth staging: success\n\n- URL: $STAGING_ORIGIN\n- Production Worker/D1 were not modified.\n- Google/SES secrets are applied only when matching GitHub Actions secrets exist.\n\n$STEPS\n\nRun: $RUN_URL"
          else
            BODY="❌ Auth staging: failed\n\nThe production Worker/D1 were not modified.\n\n$STEPS\n\nRun: $RUN_URL"
          fi
          printf '%b' "$BODY" | gh pr comment 43 --repo ${{ github.repository }} --body-file -
