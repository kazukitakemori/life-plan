name: Temporary patch operation undo

on:
  push:
    branches:
      - feature/global-back-navigation

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch App operation undo
        run: python3 scripts/tmp_patch_operation_undo.py

      - name: Commit patch and remove temporary files
        run: |
          rm .github/workflows/tmp-patch-operation-undo.yml
          rm scripts/tmp_patch_operation_undo.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx .github/workflows/tmp-patch-operation-undo.yml scripts/tmp_patch_operation_undo.py
          git commit -m "Fix operation-level undo state restoration"
          git push origin HEAD:feature/global-back-navigation
