name: One-off UI layout risk fixes

on:
  push:
    branches:
      - ui/unify-foundation-cleanup
    paths:
      - '.github/workflows/ui-layout-risk-fix-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ui/unify-foundation-cleanup
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Apply targeted overflow fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          total_anywhere = 0
          for p in Path('src').rglob('*.css'):
              t = p.read_text(encoding='utf-8')
              n = t.count('overflow-wrap: anywhere;')
              if n:
                  total_anywhere += n
                  p.write_text(t.replace('overflow-wrap: anywhere;', 'overflow-wrap: break-word;'), encoding='utf-8')
          if not (1 <= total_anywhere <= 20):
              raise SystemExit(f'Unexpected anywhere count: {total_anywhere}')
          p = Path('src/index.css')
          t = p.read_text(encoding='utf-8')
          def edit_rule(selector, replacements, prepend=None):
              global t
              pattern = re.compile(r'(' + re.escape(selector) + r'\s*\{)(.*?)(\n\})', re.S)
              matches = list(pattern.finditer(t))
              if len(matches) != 1:
                  raise SystemExit(f'Expected one rule for {selector}, found {len(matches)}')
              m = matches[0]
              body = m.group(2)
              for old, new in replacements:
                  if old not in body:
                      raise SystemExit(f'Missing declaration in {selector}: {old}')
                  body = body.replace(old, new, 1)
              if prepend:
                  body = '\n  ' + prepend + ';' + body
              t = t[:m.start()] + m.group(1) + body + m.group(3) + t[m.end():]
          edit_rule('.plan-admin-contact', [('white-space: nowrap;', 'white-space: normal;\n  overflow-wrap: break-word;')], 'min-width: 0')
          edit_rule('.plan-admin-contact-line', [('white-space: nowrap;', 'white-space: normal;\n  overflow-wrap: break-word;')])
          edit_rule('.housing-owned-field-hint', [('white-space: nowrap;', 'white-space: normal;\n  overflow-wrap: break-word;'), ('line-height: 1.125rem;', 'line-height: 1.45;')], 'min-width: 0')
          edit_rule('.loan-group-credit-life-surcharge-hint', [('white-space: nowrap;', 'white-space: normal;\n  overflow-wrap: break-word;')], 'min-width: 0')
          edit_rule('.housing-insurance-item-name', [('white-space: nowrap;', 'white-space: normal;\n  overflow-wrap: break-word;')], 'min-width: 0;\n  max-width: 100%')
          edit_rule('.linked-insurance-summary', [('white-space: nowrap;', 'white-space: normal;\n  overflow-wrap: break-word;')], 'flex: 1 1 180px;\n  min-width: 0')
          edit_rule('.housing-owned-insurance-meta', [('white-space: nowrap;', 'white-space: normal;\n  overflow-wrap: break-word;')], 'min-width: 0')
          p.write_text(t, encoding='utf-8')
          print(f'Replaced {total_anywhere} overflow-wrap:anywhere declarations.')
          print('Adjusted 7 long-text rules.')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Remove one-off workflows and commit
        run: |
          rm .github/workflows/ui-layout-risk-audit-once.yml
          rm .github/workflows/ui-layout-risk-fix-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src .github/workflows/ui-layout-risk-audit-once.yml .github/workflows/ui-layout-risk-fix-once.yml
          git commit -m "長文ラベルと補助文の横はみ出しを抑制"
          git push origin HEAD:ui/unify-foundation-cleanup
