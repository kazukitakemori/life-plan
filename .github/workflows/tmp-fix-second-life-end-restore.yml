name: Fix second-life housing end restoration

on:
  push:
    branches:
      - feat/second-life-housing-living-q12

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/second-life-housing-living-q12
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Apply restoration fix
        run: python scripts/tmp_fix_second_life_end_restore.py

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit verified source changes
        shell: bash
        run: |
          rm scripts/tmp_fix_second_life_end_restore.py
          rm .github/workflows/tmp-fix-second-life-end-restore.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore housing end dates when second-life scenario changes"
          git push origin HEAD:feat/second-life-housing-living-q12
