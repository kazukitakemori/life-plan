name: Fix cleanup CSS syntax

on:
  push:
    branches:
      - cleanup/add-card-legacy-css
    paths:
      - '.github/workflows/fix-cleanup-css-syntax.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: cleanup/add-card-legacy-css
      - name: Fix trailing commas and verify
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/ui-unification-screens.css')
          s = p.read_text(encoding='utf-8')
          old = '''    .housing-step .housing-owned-add-card,\n    .housing-step .housing-rental-add-card,\n  )'''
          new = '''    .housing-step .housing-owned-add-card,\n    .housing-step .housing-rental-add-card\n  )'''
          count = s.count(old)
          if count != 2:
              raise SystemExit(f'expected 2 malformed selector groups, found {count}')
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
          npm ci
          npm run build 2>&1 | tee /tmp/build.log
          if grep -q 'css-syntax-error\|Unexpected ")"' /tmp/build.log; then
            echo 'CSS syntax warning remains' >&2
            exit 1
          fi
          rm -f .github/workflows/fix-cleanup-css-syntax.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui-unification-screens.css .github/workflows
          git commit -m "クリーンアップ後のCSS構文を修正"
          git push origin HEAD:cleanup/add-card-legacy-css
