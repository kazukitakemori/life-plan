name: Temporary redo patch

on:
  push:
    branches:
      - feature/global-back-navigation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch redo behavior
        run: python3 .github/tmp_redo_patch.py

      - name: Commit patch and remove temporary files
        shell: bash
        run: |
          rm .github/tmp_redo_patch.py .github/workflows/tmp-redo-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx .github/tmp_redo_patch.py .github/workflows/tmp-redo-patch.yml
          git commit -m "Add redo support for operation history"
          git push origin HEAD:feature/global-back-navigation
