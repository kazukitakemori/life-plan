name: Apply non-destructive second-life overlay

on:
  push:
    branches:
      - feat/second-life-housing-living-q12
    paths:
      - scripts/tmp-second-life-overlay.py
      - .github/workflows/tmp-second-life-overlay.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/second-life-housing-living-q12
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Apply patch
        run: python scripts/tmp-second-life-overlay.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit verified source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "Make second-life housing and living non-destructive" || exit 0
          git push
