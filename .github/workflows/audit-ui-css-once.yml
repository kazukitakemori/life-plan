name: One-off UI CSS responsibility cleanup

on:
  push:
    branches:
      - refactor/mobile-responsive-steps
    paths:
      - .github/workflows/audit-ui-css-once.yml

permissions:
  contents: write

jobs:
  audit-and-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/mobile-responsive-steps
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Consolidate shared UI CSS ownership
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path('src')

          def read(name):
              return (root / name).read_text(encoding='utf-8')

          def write(name, text):
              (root / name).write_text(text, encoding='utf-8')

          def sub_once(text, pattern, repl, label, flags=0):
              next_text, count = re.subn(pattern, repl, text, count=1, flags=flags)
              if count != 1:
                  print(f'{label}: expected exactly 1 match, found {count}', file=sys.stderr)
                  sys.exit(1)
              return next_text

          # Base ui-input/ui-select geometry uses shared design tokens at the source.
          index = read('index.css')
          index = sub_once(
              index,
              r'(\.ui-input,\n\.ui-select \{\n\s*min-height: var\(--control-height\);\n\s*padding: 8px 12px;\n\s*border: 1px solid )#c5d0c9;(\n\s*border-radius: )var\(--radius-sm\);',
              r'\1var(--ui-control-border);\2var(--ui-control-radius);',
              'index ui-input/ui-select',
          )
          index = sub_once(
              index,
              r'(\.ui-btn--danger \{\n\s*border-color: )#e0b4b4;',
              r'\1var(--ui-danger-border);',
              'index ui-btn--danger',
          )
          write('index.css', index)

          ui = read('ui-system.css')
          if '--ui-danger-border:' not in ui:
              ui = sub_once(
                  ui,
                  r'(\s*--ui-control-border-hover: #97a49d;\n)',
                  r'\1  --ui-danger-border: #e0b4b4;\n',
                  'ui danger token',
              )

          ui = sub_once(
              ui,
              r':is\(\.ui-input, \.ui-select, \.ui-copy-bar-select\) \{\n\s*border-color: var\(--ui-control-border\);\n\s*border-radius: var\(--ui-control-radius\);\n\s*background: var\(--color-surface\);\n\s*color: var\(--color-ink\);\n\s*transition:\n\s*border-color var\(--ui-transition-fast\),\n\s*box-shadow var\(--ui-transition-fast\),\n\s*background var\(--ui-transition-fast\);\n\}',
              ''':is(.ui-input, .ui-select) {
  transition:
    border-color var(--ui-transition-fast),
    box-shadow var(--ui-transition-fast),
    background var(--ui-transition-fast);
}

.ui-copy-bar-select {
  border-color: var(--ui-control-border);
  border-radius: var(--ui-control-radius);
  background: var(--color-surface);
  color: var(--color-ink);
  transition:
    border-color var(--ui-transition-fast),
    box-shadow var(--ui-transition-fast),
    background var(--ui-transition-fast);
}''',
              'ui common controls',
          )
          write('ui-system.css', ui)

          # Text integrity belongs to the shared text layer, not Q5-specific CSS.
          integrity = read('ui-text-integrity.css')
          integrity = sub_once(
              integrity,
              r'(\s*\.ui-segmented-label,\n\s*\.living-summary-label,\n\s*\.celebration-gift-block-title)(\n\s*\) \{)',
              r'\1,\n    .housing-section-title,\n    .housing-owned-detail-title\2',
              'text-integrity headings',
          )
          integrity = sub_once(
              integrity,
              r'\.step-page :where\(\.life-event-table-cell, \.living-table-cell\)::before \{\n\s*word-break: keep-all;\n\s*overflow-wrap: anywhere;\n\}',
              '''.step-page :where(
    .education-table-cell,
    .life-event-table-cell,
    .living-table-cell,
    .housing-table-cell
  )::before {
  word-break: keep-all;
  overflow-wrap: anywhere;
}''',
              'text-integrity generated labels',
          )
          write('ui-text-integrity.css', integrity)

          housing = read('mobileHousing.css')
          housing = sub_once(
              housing,
              r'\n\s*\.housing-step \.housing-section-title,\n\s*\.housing-step \.housing-owned-detail-title \{\n\s*word-break: keep-all;\n\s*overflow-wrap: anywhere;\n\s*\}\n',
              '\n',
              'housing heading text-integrity duplicate',
          )
          housing = sub_once(
              housing,
              r'(\.housing-step \.housing-table-cell::before \{.*?line-height: var\(--leading-tight\);)\n\s*word-break: keep-all;\n\s*overflow-wrap: anywhere;',
              r'\1',
              'housing generated label text-integrity duplicate',
              flags=re.S,
          )
          write('mobileHousing.css', housing)

          # Same semantic danger border uses one shared token.
          for name in ['mobileLifeEvent.css', 'mobileLiving.css', 'mobileHousing.css']:
              text = read(name).replace('#e0b4b4', 'var(--ui-danger-border)')
              write(name, text)

          # Screen-specific files must not take ownership of common shell/member/copy UI.
          common_mobile_files = {'mobile.css', 'mobileCompact.css', 'mobileSteps.css'}
          screen_files = [
              path for path in sorted(root.glob('mobile*.css'))
              if path.name not in common_mobile_files
          ]
          forbidden = re.compile(
              r'(^|\n)\s*(?:\.step-header|\.shell-main|\.ui-member-tabs(?:-|\b)|\.ui-copy-bar(?:-|\b))'
          )
          leaks = []
          for path in screen_files:
              if forbidden.search(path.read_text(encoding='utf-8')):
                  leaks.append(path.name)
          if leaks:
              print('Common UI ownership leak in screen-specific CSS: ' + ', '.join(leaks), file=sys.stderr)
              sys.exit(1)

          housing_text = read('mobileHousing.css')
          for token in ['word-break:', 'overflow-wrap:']:
              if token in housing_text:
                  print(f'mobileHousing.css still contains {token}', file=sys.stderr)
                  sys.exit(1)

          for name in ['mobileLifeEvent.css', 'mobileLiving.css', 'mobileHousing.css']:
              if '#e0b4b4' in read(name):
                  print(f'{name} still contains raw danger border literal', file=sys.stderr)
                  sys.exit(1)

          if 'border-color: var(--ui-danger-border);' not in read('index.css'):
              print('ui-btn--danger is not using the shared danger token', file=sys.stderr)
              sys.exit(1)

          print('UI CSS responsibility audit passed.')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet -- src/index.css src/ui-system.css src/ui-text-integrity.css src/mobileHousing.css src/mobileLifeEvent.css src/mobileLiving.css; then
            echo "No CSS changes to commit."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.css src/ui-system.css src/ui-text-integrity.css src/mobileHousing.css src/mobileLifeEvent.css src/mobileLiving.css
          git commit -m "共通UIのCSS責務と色トークンを整理"
          git push origin HEAD:refactor/mobile-responsive-steps
