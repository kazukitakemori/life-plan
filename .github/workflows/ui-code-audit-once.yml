name: One-off UI code audit

on:
  push:
    branches:
      - ui/unify-foundation-cleanup
    paths:
      - '.github/workflows/ui-code-audit-once.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Audit CSS and TSX for visual-risk patterns
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          from collections import Counter, defaultdict

          findings = []
          counts = Counter()
          important_by_file = Counter()
          nowrap_by_file = Counter()

          def add(kind, path, line_no, text):
              counts[kind] += 1
              findings.append((kind, str(path), line_no, text.strip()[:220]))

          css_files = sorted(Path('src').rglob('*.css'))
          tsx_files = sorted(Path('src').rglob('*.tsx'))

          for path in css_files:
              lines = path.read_text(encoding='utf-8').splitlines()
              current_selector = ''
              selector_buf = []
              for i, line in enumerate(lines, 1):
                  stripped = line.strip()
                  if '{' in line:
                      before = line.split('{', 1)[0].strip()
                      if before:
                          selector_buf.append(before)
                      current_selector = ' '.join(selector_buf)[-300:]
                      selector_buf = []
                  elif stripped and not stripped.startswith('@') and ':' not in stripped and '}' not in stripped and not stripped.startswith('/*') and not stripped.startswith('*'):
                      selector_buf.append(stripped)
                  if '}' in line:
                      current_selector = ''

                  m = re.search(r'font-size\s*:\s*([0-9.]+)px', line)
                  if m and float(m.group(1)) < 13:
                      add('SMALL_FONT_LT13', path, i, f'{current_selector} :: {stripped}')

                  if re.search(r'word-break\s*:\s*break-all\b', line):
                      add('AGGRESSIVE_BREAK_ALL', path, i, f'{current_selector} :: {stripped}')
                  if re.search(r'overflow-wrap\s*:\s*anywhere\b', line):
                      add('AGGRESSIVE_WRAP_ANYWHERE', path, i, f'{current_selector} :: {stripped}')
                  if re.search(r'overflow-x\s*:\s*hidden\b', line):
                      add('HIDDEN_HORIZONTAL_OVERFLOW', path, i, f'{current_selector} :: {stripped}')
                  if re.search(r'white-space\s*:\s*nowrap\b', line):
                      nowrap_by_file[str(path)] += 1
                      if path.name.startswith('mobile') and not re.search(r'(unit|badge|date|year|month|age|amount|icon|button|btn|status|tab)', current_selector, re.I):
                          add('MOBILE_NOWRAP_REVIEW', path, i, f'{current_selector} :: {stripped}')

                  if '!important' in line:
                      important_by_file[str(path)] += line.count('!important')

                  if 'var(--color-' in line and (path.name.startswith('mobile') or path.name.startswith('ui-')):
                      add('LEGACY_COLOR_TOKEN_IN_NEW_LAYER', path, i, f'{current_selector} :: {stripped}')

                  if path.name.startswith('mobile'):
                      m = re.search(r'(?<!max-)min-width\s*:\s*([0-9.]+)px', line)
                      if m and float(m.group(1)) >= 280:
                          add('MOBILE_LARGE_MIN_WIDTH', path, i, f'{current_selector} :: {stripped}')
                      m = re.search(r'(?<!min-)width\s*:\s*([0-9.]+)px', line)
                      if m and float(m.group(1)) >= 360:
                          add('MOBILE_FIXED_WIDTH_GE360', path, i, f'{current_selector} :: {stripped}')
                      m = re.search(r'height\s*:\s*([0-9.]+)px', line)
                      if m and float(m.group(1)) <= 36 and re.search(r'(button|btn|input|select|control|field|toggle)', current_selector, re.I):
                          add('MOBILE_TIGHT_CONTROL_HEIGHT', path, i, f'{current_selector} :: {stripped}')

          for path in tsx_files:
              lines = path.read_text(encoding='utf-8').splitlines()
              for i, line in enumerate(lines, 1):
                  m = re.search(r'fontSize\s*:\s*["\']?([0-9.]+)(?:px)?["\']?', line)
                  if m:
                      try:
                          if float(m.group(1)) < 13:
                              add('TSX_INLINE_SMALL_FONT', path, i, line)
                      except ValueError:
                          pass
                  if re.search(r'wordBreak\s*:\s*["\']break-all["\']', line):
                      add('TSX_INLINE_BREAK_ALL', path, i, line)
                  if re.search(r'overflowWrap\s*:\s*["\']anywhere["\']', line):
                      add('TSX_INLINE_WRAP_ANYWHERE', path, i, line)
                  if re.search(r'overflowX\s*:\s*["\']hidden["\']', line):
                      add('TSX_INLINE_HIDDEN_OVERFLOW', path, i, line)
                  if re.search(r'whiteSpace\s*:\s*["\']nowrap["\']', line):
                      add('TSX_INLINE_NOWRAP', path, i, line)
                  if '<br' in line and re.search(r'(button|label|title|name|date|unit)', line, re.I):
                      add('TSX_FORCED_BREAK_REVIEW', path, i, line)

          print('=== UI CODE AUDIT SUMMARY ===')
          print(f'CSS files: {len(css_files)} / TSX files: {len(tsx_files)}')
          for kind, n in counts.most_common():
              print(f'{kind}: {n}')

          print('\n=== !important COUNTS (top 20) ===')
          for path, n in important_by_file.most_common(20):
              print(f'{n:4d}  {path}')

          print('\n=== nowrap COUNTS (top 20) ===')
          for path, n in nowrap_by_file.most_common(20):
              print(f'{n:4d}  {path}')

          print('\n=== HIGH-SIGNAL FINDINGS ===')
          priority = [
              'SMALL_FONT_LT13','TSX_INLINE_SMALL_FONT','AGGRESSIVE_BREAK_ALL','TSX_INLINE_BREAK_ALL',
              'AGGRESSIVE_WRAP_ANYWHERE','TSX_INLINE_WRAP_ANYWHERE','HIDDEN_HORIZONTAL_OVERFLOW',
              'TSX_INLINE_HIDDEN_OVERFLOW','MOBILE_LARGE_MIN_WIDTH','MOBILE_FIXED_WIDTH_GE360',
              'MOBILE_TIGHT_CONTROL_HEIGHT','MOBILE_NOWRAP_REVIEW','LEGACY_COLOR_TOKEN_IN_NEW_LAYER',
              'TSX_FORCED_BREAK_REVIEW','TSX_INLINE_NOWRAP'
          ]
          grouped = defaultdict(list)
          for f in findings:
              grouped[f[0]].append(f)
          for kind in priority:
              items = grouped.get(kind, [])
              if not items:
                  continue
              print(f'\n[{kind}] {len(items)}')
              for _, path, line_no, text in items[:80]:
                  print(f'{path}:{line_no}: {text}')
              if len(items) > 80:
                  print(f'... {len(items)-80} more')
          PY
