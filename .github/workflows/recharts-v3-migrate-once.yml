name: Recharts v3 migration (one-off)

on:
  push:
    branches:
      - chore/recharts-v3-20260914

permissions:
  contents: write

jobs:
  migrate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chore/recharts-v3-20260914

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Recharts v3 compatibility fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old in text:
                  p.write_text(text.replace(old, new, 1))
                  print(f"updated: {path}")
              elif new in text:
                  print(f"already updated: {path}")
              else:
                  raise SystemExit(f"expected snippet not found: {path}")

          for path, margin in [
              ('src/components/assetBuilding/assetBuildingChartShared.tsx', 'ASSET_CHART_MARGIN_LEFT'),
              ('src/components/requiredCoverage/requiredCoverageChartShared.tsx', 'CHART_MARGIN_LEFT'),
          ]:
              replace_once(
                  path,
                  "  x?: number;\n  y?: number;\n  index?: number;",
                  "  x?: string | number;\n  y?: string | number;\n  index?: number;",
              )
              replace_once(
                  path,
                  f"  const labelXInGroup = {margin} - 8 - x;",
                  f"  const xOffset = typeof x === 'number' ? x : Number(x) || 0;\n  const labelXInGroup = {margin} - 8 - xOffset;",
              )

          replace_once(
              'src/components/education/EducationExpenseChart.tsx',
              "interface XAxisTickProps {\n  x?: number;\n  y?: number;",
              "interface XAxisTickProps {\n  x?: string | number;\n  y?: string | number;",
          )
          replace_once(
              'src/components/education/EducationExpenseChart.tsx',
              "  const labelXInGroup = labelX - x;\n  const year = payload.value;",
              "  const xOffset = typeof x === 'number' ? x : Number(x) || 0;\n  const labelXInGroup = labelX - xOffset;\n  const year = payload.value;",
          )

          replace_once(
              'src/components/assetBuilding/LifetimeBalanceSimulationChart.tsx',
              "interface ChartMouseState {\n  activeTooltipIndex?: number;\n  activeLabel?: number | string;\n  isTooltipActive?: boolean;\n}",
              "interface ChartMouseState {\n  activeTooltipIndex?: unknown;\n  activeLabel?: unknown;\n  isTooltipActive?: boolean;\n}",
          )
          replace_once(
              'src/components/assetBuilding/LifetimeBalanceSimulationChart.tsx',
              "  const byIndex =\n    state.activeTooltipIndex != null && state.activeTooltipIndex >= 0\n      ? points[state.activeTooltipIndex]?.headAge\n      : undefined;",
              "  const tooltipIndex =\n    typeof state.activeTooltipIndex === 'number'\n      ? state.activeTooltipIndex\n      : typeof state.activeTooltipIndex === 'string'\n        ? Number(state.activeTooltipIndex)\n        : null;\n  const byIndex =\n    tooltipIndex != null && Number.isInteger(tooltipIndex) && tooltipIndex >= 0\n      ? points[tooltipIndex]?.headAge\n      : undefined;",
          )

          replace_once(
              'src/components/requiredCoverage/RequiredCoverageNeedChart.tsx',
              "                    onMouseMove={(state: {\n                      activeTooltipIndex?: number;\n                      isTooltipActive?: boolean;\n                    }) => {",
              "                    onMouseMove={(state) => {",
          )
          replace_once(
              'src/components/requiredCoverage/RequiredCoverageNeedChart.tsx',
              "                      const index = state.activeTooltipIndex;\n                      setHoveredHeadAge(\n                        index != null\n                          ? (visiblePoints[index]?.headAge ?? null)\n                          : null,\n                      );",
              "                      const rawIndex = state.activeTooltipIndex;\n                      const index =\n                        typeof rawIndex === 'number'\n                          ? rawIndex\n                          : typeof rawIndex === 'string'\n                            ? Number(rawIndex)\n                            : null;\n                      setHoveredHeadAge(\n                        index != null && Number.isInteger(index)\n                          ? (visiblePoints[index]?.headAge ?? null)\n                          : null,\n                      );",
          )
          PY

          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/components
            git commit -m "Recharts v3の型変更に対応"
            git push origin HEAD:chore/recharts-v3-20260914
          fi

      - name: Audit dependencies
        run: npm audit

      - name: Build
        run: npm run build
