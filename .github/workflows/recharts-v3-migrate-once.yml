name: Recharts v3 migration (one-off)

on:
  push:
    branches:
      - chore/recharts-v3-20260914

permissions:
  contents: write

jobs:
  migrate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chore/recharts-v3-20260914

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install current dependencies
        run: npm ci

      - name: Upgrade Recharts to v3
        shell: bash
        run: |
          CURRENT_SPEC=$(node -p "require('./package.json').dependencies.recharts")
          if [ "$CURRENT_SPEC" != "^3.10.1" ]; then
            npm install --save recharts@3.10.1 react-is@19.2.7
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "Rechartsをv3.10.1へ更新"
            git push origin HEAD:chore/recharts-v3-20260914
          else
            echo "Recharts is already on ^3.10.1"
          fi

      - name: Audit dependencies
        run: npm audit

      - name: Build
        run: npm run build
