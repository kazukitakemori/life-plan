name: Temporary third-life start guard

on:
  push:
    branches:
      - feat/second-life-housing-living-q12
    paths:
      - scripts/tmp_third_life_start_guard.py
      - .github/workflows/tmp-third-life-start-guard.yml

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/second-life-housing-living-q12
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Apply lifespan guard
        run: python scripts/tmp_third_life_start_guard.py
      - run: npm ci
      - run: npm run build
      - name: Remove temporary files
        run: rm -f scripts/tmp_third_life_start_guard.py .github/workflows/tmp-third-life-start-guard.yml
      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Guard third-life timing by expected lifespan"
          git push origin HEAD:feat/second-life-housing-living-q12
