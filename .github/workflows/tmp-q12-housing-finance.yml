name: Temporary Q12 housing finance patch

on:
  push:
    branches:
      - feat/second-life-housing-living-q12
    paths:
      - scripts/tmp_q12_housing_finance.py
      - .github/workflows/tmp-q12-housing-finance.yml

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/second-life-housing-living-q12
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply Q12 housing finance patch
        run: python scripts/tmp_q12_housing_finance.py
      - name: Remove obsolete type imports
        run: |
          sed -i '/  SecondLifeHousingScenario,/d' src/lib/secondLifeEstimates.ts
          sed -i '/  SecondLifeHometownOption,/d' src/lib/secondLifeEstimates.ts
          sed -i '/  SecondLifeNewAreaOption,/d' src/lib/secondLifeEstimates.ts
          sed -i '/  SecondLifeStayOption,/d' src/lib/secondLifeEstimates.ts
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Remove temporary files
        run: rm -f scripts/tmp_q12_housing_finance.py .github/workflows/tmp-q12-housing-finance.yml
      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make Q12 housing financing explicit and safe"
          git push origin HEAD:feat/second-life-housing-living-q12
