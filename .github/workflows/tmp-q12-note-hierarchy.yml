name: Temporary Q12 note hierarchy

on:
  push:
    branches:
      - feat/second-life-housing-living-q12

permissions:
  contents: write

jobs:
  patch-build-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/second-life-housing-living-q12
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Reduce Q12 warning color and disclosure density
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1. Helper copy is neutral by default. Reserve warning color for true cautions.
          css = Path('src/index.css')
          text = css.read_text()
          old = '''.second-life-apply-note {\n  color: #c62828;\n}\n'''
          new = '''.second-life-apply-note {\n  color: var(--color-muted);\n}\n\n.second-life-apply-note--warning {\n  color: #92400e;\n}\n\n.second-life-summary-note {\n  color: var(--color-ink);\n  font-weight: 600;\n}\n'''
          if old not in text:
              raise SystemExit('second-life-apply-note color marker not found')
          css.write_text(text.replace(old, new, 1))

          # 2. Housing: concise visible copy, assumptions on demand, no repeated source-of-truth explanation.
          path = Path('src/components/secondLife/SecondLifeHousingSection.tsx')
          text = path.read_text()

          text = text.replace(
              '''                  <p className="second-life-apply-note">\n                    借入予定額：{formatSecondLifeMan(loanPrincipalMan)}万円\n                    {loanMonthlyMan != null\n                      ? ` ／ 月々の返済目安：約${formatSecondLifeMan(loanMonthlyMan)}万円`\n                      : ''}\n                  </p>''',
              '''                  <p className="second-life-apply-note second-life-summary-note">\n                    借入予定額：{formatSecondLifeMan(loanPrincipalMan)}万円\n                    {loanMonthlyMan != null\n                      ? ` ／ 月々の返済目安：約${formatSecondLifeMan(loanMonthlyMan)}万円`\n                      : ''}\n                  </p>''',
              1,
          )

          text = text.replace(
              '''                    <p className="second-life-apply-note">\n                      金利と返済期間がそろうまでは、ローンを勝手に作らず、住まい本体の目安額を一括支出として仮計算します。\n                    </p>''',
              '''                    <p className="second-life-apply-note">\n                      金利・返済期間を入力すると月々の返済額を試算します。未入力の間は一括支出として仮計算します。\n                    </p>''',
              1,
          )

          text = text.replace(
              '''                    <p className="second-life-apply-note">\n                      返済終了は世帯主{estimatedLoanEndAge}歳ごろの設定です。実際に借りられる期間・金利・審査条件は金融機関や商品で異なるため、実際の条件を確認してください。\n                    </p>''',
              '''                    <p className="second-life-apply-note second-life-apply-note--warning">\n                      返済終了は世帯主{estimatedLoanEndAge}歳ごろです。借入可能な期間は金融機関・商品によって異なります。\n                    </p>''',
              1,
          )

          old_assumptions = '''                  <p className="second-life-apply-note">\n                    ローン返済は固定金利・元利均等・ボーナス返済なしの簡易試算です。実際の借入条件を保証するものではありません。\n                  </p>'''
          new_assumptions = '''                  <details className="second-life-reference-details">\n                    <summary>ローン試算の前提を見る</summary>\n                    <div className="second-life-reference-body">\n                      <p>\n                        固定金利・元利均等・ボーナス返済なしの簡易試算です。実際の借入条件を保証するものではありません。\n                      </p>\n                      {state.includeMovingCost || state.includePostPurchaseRenovation ? (\n                        <p>\n                          引越し費・購入後リフォーム費はローンに含めず、一括支出として試算します。\n                        </p>\n                      ) : null}\n                    </div>\n                  </details>'''
          if old_assumptions not in text:
              raise SystemExit('loan assumption marker not found')
          text = text.replace(old_assumptions, new_assumptions, 1)

          text = text.replace(
              '''              <p className="second-life-apply-note">\n                試算する住まい関連費の合計：{formatSecondLifeMan(total)}万円\n                {state.includeMovingCost || state.includePostPurchaseRenovation\n                  ? '（住まい本体＋選択した追加費用）'\n                  : ''}\n              </p>''',
              '''              <p className="second-life-apply-note second-life-summary-note">\n                試算する住まい関連費の合計：{formatSecondLifeMan(total)}万円\n                {state.includeMovingCost || state.includePostPurchaseRenovation\n                  ? '（住まい本体＋選択した追加費用）'\n                  : ''}\n              </p>''',
              1,
          )

          # This information now lives in the expandable loan assumptions.
          text = text.replace(
              '''              {state.includeMovingCost || state.includePostPurchaseRenovation ? (\n                <p className="second-life-apply-note">\n                  引越し費・購入後リフォーム費は、現時点ではローンに含めず一括支出として試算します。\n                </p>\n              ) : null}\n''',
              '',
              1,
          )

          # Remove the repeated explanation called out in the screenshot/review.
          repeated = '''\n          <div className="second-life-section-actions">\n            <p className="second-life-apply-note">\n              元の「住まい」の入力は残ります。計算では、{state.housingActionAge}歳から上で選んだ住まい方に切り替わります。\n            </p>\n          </div>'''
          if repeated not in text:
              raise SystemExit('repeated housing explanation marker not found')
          text = text.replace(repeated, '', 1)

          path.write_text(text)
          PY
      - run: npm ci
      - run: npm run build
      - name: Remove temporary workflow and commit verified changes
        run: |
          rm -f .github/workflows/tmp-q12-note-hierarchy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clarify Q12 information hierarchy"
          git push origin HEAD:feat/second-life-housing-living-q12
