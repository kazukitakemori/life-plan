name: Apply Safe UI Cleanup

on:
  push:
    branches:
      - cleanup/ui-dead-code
    paths:
      - .github/workflows/ui-cleanup-apply.yml

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: cleanup/ui-dead-code
      - name: Remove final migration tokens
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('src/index.css')
          text = index.read_text(encoding='utf-8')
          original = text

          replacements = [
              ('var(--ui-control-border)', 'var(--ui-border)'),
              ('var(--ui-danger-border)', 'color-mix(in srgb, var(--ui-danger) 30%, white)'),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence of {old!r}, got {count}')
              text = text.replace(old, new, 1)

          dead = '  --text-xl: 1.375rem; /* 22px */\n'
          count = text.count(dead)
          if count != 1:
              raise SystemExit(f'Expected exactly one unused --text-xl declaration, got {count}')
          text = text.replace(dead, '', 1)
          index.write_text(text, encoding='utf-8')

          ui = Path('src/ui-unification.css')
          ui_text = ui.read_text(encoding='utf-8')
          migration = (
              '  /* Migration aliases that are still referenced by legacy screen CSS. */\n'
              '  --ui-control-border: var(--ui-border);\n'
              '  --ui-danger-border: color-mix(in srgb, var(--ui-danger) 30%, white);\n'
          )
          count = ui_text.count(migration)
          if count != 1:
              raise SystemExit(f'Expected one migration alias block, got {count}')
          ui_text = ui_text.replace(migration, '', 1)
          ui.write_text(ui_text, encoding='utf-8')

          print(f'index.css bytes: {len(original.encode())} -> {len(text.encode())}')
          print('Removed final UI migration alias block')
          PY

          npm ci
          npm run build

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.css src/ui-unification.css
          git commit -m "残存UI移行トークンを削除"
          git push origin HEAD:cleanup/ui-dead-code
