name: Temporary Q12 UX accuracy patch

on:
  push:
    branches:
      - feat/second-life-housing-living-q12
    paths:
      - scripts/tmp_q12_ux_accuracy_review.py
      - scripts/tmp_q12_guide_normalize.py
      - .github/workflows/tmp-q12-ux-accuracy.yml

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/second-life-housing-living-q12
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply reviewed patch
        id: patch
        shell: bash
        run: |
          set +e
          {
            python scripts/tmp_q12_guide_normalize.py
            python scripts/tmp_q12_ux_accuracy_review.py
          } > /tmp/q12-patch.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            git reset --hard HEAD
            cp /tmp/q12-patch.log .q12-patch-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .q12-patch-error.txt
            git commit -m "Capture Q12 patch failure"
            git push origin HEAD:feat/second-life-housing-living-q12
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        if: steps.patch.outputs.ok == 'true'
        run: npm ci
      - name: Build
        if: steps.patch.outputs.ok == 'true'
        run: npm run build
      - name: Remove temporary patch files
        if: steps.patch.outputs.ok == 'true'
        run: |
          rm scripts/tmp_q12_ux_accuracy_review.py
          rm scripts/tmp_q12_guide_normalize.py
          rm .github/workflows/tmp-q12-ux-accuracy.yml
          rm -f .q12-patch-error.txt
      - name: Commit verified changes
        if: steps.patch.outputs.ok == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine Q12 UX and calculation accuracy"
          git push origin HEAD:feat/second-life-housing-living-q12
