name: Dependency fix once

on:
  push:
    branches:
      - chore/dependency-audit-20260914
    paths:
      - '.github/workflows/dependency-fix-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/dependency-audit-20260914
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Refresh lockfile with non-breaking audit fixes
        run: npm audit fix --package-lock-only
      - name: Install updated lockfile
        run: npm ci
      - name: Verify audit
        run: npm audit
      - name: Verify production audit
        run: npm audit --omit=dev
      - name: Verify build
        run: npm run build
      - name: Commit lockfile update
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'No lockfile changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m '依存パッケージの脆弱性を非破壊更新で解消'
          git push origin HEAD:chore/dependency-audit-20260914
